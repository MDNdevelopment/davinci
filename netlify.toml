[build]
  command = "astro build"
  publish = "dist"

[build.environment]
  # package.json requires node >=22.12.0 (Astro 7); Netlify's default
  # build image runs an older Node unless pinned here.
  NODE_VERSION = "22"

# Astro fingerprints these filenames with a content hash, so they're safe to
# cache for a year. Images/fonts aren't hashed, but they change rarely and
# get a shorter, still-long cache window.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
